<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#170F28">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NScribe">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob:; connect-src 'self' https://huggingface.co https://*.huggingface.co https://*.hf.co; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>NScribe</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app" hidden>
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 60 44" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14 38C8 38 5 33 6.5 28.5C7.5 25.5 10 24 12.5 23.5C13 17 18 13 23.5 13C27 13 30 14.8 31.8 17.4C33 16.6 34.6 16.2 36.2 16.2C41 16.2 44.5 19.8 44.5 24.5C44.5 25.2 44.4 25.8 44.2 26.4C47.5 26.9 49.5 29.5 49 32.5C48.6 35.5 46 38 42 38Z" stroke="var(--cloud)" stroke-width="2.8"/>
        <path d="M21 34V22L33 34V22" stroke="var(--coral)" stroke-width="3.2"/>
        <path d="M41 8.5A9 9 0 0 1 49.5 17" stroke="var(--cloud)" stroke-width="2.4"/>
      </svg>
      <span class="word"><i>N</i>Scribe</span>
      <span class="prod">by nubicor</span>
    </div>
    <button class="pill-btn" id="modelpill" type="button" aria-label="Speech model status"></button>
    <span class="savestate" id="savestate" data-s="idle"><i></i><span id="savetext">Saved on this device</span></span>
    <button class="icon-btn" id="lockbtn" type="button" aria-label="Lock app" hidden>Lock</button>
    <button class="icon-btn" id="settingsbtn" type="button" aria-label="Settings">Settings</button>
  </header>

  <nav class="zones" id="zones" role="tablist" aria-label="Zones"></nav>
  <section id="beds" class="beds" aria-label="Beds"></section>
  <section id="banner"></section>
  <section id="overview" class="overview" hidden></section>
  <main id="work" class="work"></main>
</div>

<div id="micbar" class="micbar" hidden></div>
<div id="lock" class="overlay lock" hidden></div>
<div id="printarea" aria-hidden="true"></div>
<noscript><p style="padding:24px">NScribe needs JavaScript.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
